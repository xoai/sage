name: sage
kind: standalone
version: "1.3.18"
description: >-
  Profile-bound Sage lifecycle context, collision-free workflow commands,
  deterministic gate tools, and project-only memory for Hermes. Mechanical
  lifecycle gates remain owned by the selected profile's configured shell hooks.
author: "Sage (Hermes platform adapter)"

provides_slash_commands: true
provides_tools:
  - sage_run_gates
  - sage_spec_check
  - sage_hallucination_check
  - sage_verify
  - sage_visual_gate
  - sage_memory_set_project
  - sage_memory_store
  - sage_memory_search

provides_hooks:
  - on_session_start
  - pre_llm_call
  - transform_tool_result
  - pre_verify
